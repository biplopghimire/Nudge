# Runs the app's and the API's checks on every pull request and on pushes to
# the shared branches.
name: Tests

on:
  pull_request:
  push:
    branches: [main, nudge-engine-v1]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck, lint, Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nudge-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nudge-app/package-lock.json
      - run: npm ci
      # `expo start` writes this file locally (it's gitignored); it declares
      # Expo's global types, such as `.css` imports.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  api:
    name: API (ruff, pytest on memory and Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nudge-api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nudge
          POSTGRES_PASSWORD: nudge
          POSTGRES_DB: nudge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nudge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NUDGE_DATABASE_URL: postgresql://nudge:nudge@localhost:5432/nudge_test
      NUDGE_TEST_DATABASE_URL: postgresql://nudge:nudge@localhost:5432/nudge_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: nudge-api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m scripts.db reset
      - run: pytest
